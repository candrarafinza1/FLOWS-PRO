<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memproses Login | FLOWS-PRO</title>

    <link rel="icon" href="LOGO_FLOWS-PRO-removebg-preview.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at top left, #dbeafe, transparent 40%),
                linear-gradient(135deg, #eff6ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #0f172a;
        }

        .callback-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #dbeafe;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(30, 64, 175, 0.10);
        }

        .logo {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #dbeafe;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 23px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 600;
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="callback-card">

        <img
            src="LOGO_FLOWS-PRO-removebg-preview.png"
            alt="Logo FLOWS-PRO"
            class="logo"
        >

        <div class="loader" id="loader"></div>

        <h1 id="title">Memverifikasi Akun</h1>

        <p id="description">
            Mohon tunggu sebentar. Kami sedang menyelesaikan proses login Google Anda.
        </p>

        <div class="status" id="statusMessage">
            Menghubungkan ke FLOWS-PRO...
        </div>

        <a href="login.html" class="back-link" id="backLink" style="display:none;">
            Kembali ke halaman login
        </a>

    </div>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // =====================================
        // KONFIGURASI SUPABASE FLOWS-PRO
        // =====================================

        const SUPABASE_URL =
            "https://nydapuhnswrbgbjkaxqa.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_dypnRnjABFIf6GcshfrTIA_Q0zhuR0L";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        // =====================================
        // ELEMEN HALAMAN
        // =====================================

        const titleElement = document.getElementById("title");
        const descriptionElement = document.getElementById("description");
        const statusElement = document.getElementById("statusMessage");
        const loaderElement = document.getElementById("loader");
        const backLink = document.getElementById("backLink");


        // =====================================
        // TAMPILKAN PESAN
        // =====================================

        function showStatus(message, isError = false) {
            statusElement.textContent = message;

            if (isError) {
                statusElement.classList.add("error");
                loaderElement.style.display = "none";
                backLink.style.display = "inline-block";
                titleElement.textContent = "Login Gagal";
                descriptionElement.textContent =
                    "Kami tidak dapat menyelesaikan proses login Anda.";
            }
        }


        // =====================================
        // PROSES CALLBACK GOOGLE
        // =====================================

        async function handleAuthCallback() {
            try {
                showStatus("Memverifikasi sesi login...");

                // Ambil sesi autentikasi dari Supabase
                const {
                    data: { session },
                    error
                } = await supabaseClient.auth.getSession();

                if (error) {
                    throw error;
                }

                // Jika sesi tidak ditemukan
                if (!session) {
                    throw new Error(
                        "Sesi login tidak ditemukan. Silakan login kembali."
                    );
                }

                showStatus("Login berhasil! Mengarahkan ke dashboard...");

                titleElement.textContent = "Login Berhasil";
                descriptionElement.textContent =
                    "Selamat datang di sistem pemantauan FLOWS-PRO.";

                // Beri waktu agar pesan terbaca
                setTimeout(() => {
                    window.location.replace("dashboard.html");
                }, 1200);

            } catch (error) {
                console.error("Auth Callback Error:", error);

                showStatus(
                    error.message || "Terjadi kesalahan saat login.",
                    true
                );
            }
        }


        // =====================================
        // JALANKAN CALLBACK
        // =====================================

        handleAuthCallback();

    </script>
    </body>
</html>

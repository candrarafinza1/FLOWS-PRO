<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FLOWS-PRO</title>

    <link rel="icon" href="LOGO_FLOWS-PRO-removebg-preview.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --primary: #0788ff;
            --secondary: #00c6f7;
            --dark: #071b2d;
            --white: #ffffff;
            --muted: #a9bacb;
            --border: rgba(255,255,255,0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            color: var(--white);
            background:
                linear-gradient(rgba(3,18,33,0.82), rgba(3,18,33,0.94)),
                url("banjir.jpg") center/cover fixed;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            padding: 38px;
            background: rgba(12, 34, 53, 0.91);
            border: 1px solid var(--border);
            border-radius: 22px;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
            animation: fadeUp 0.6s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.8px;
        }

        .login-header p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            padding: 10px 15px;
            border-radius: 30px;
            background: rgba(16,185,129,0.12);
            color: #75e3b5;
            font-size: 11px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: 600;
            color: #dce8f4;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8ba3b8;
        }

        .form-control {
            width: 100%;
            padding: 15px 45px;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            color: white;
            font-family: inherit;
            font-size: 13px;
            transition: 0.25s ease;
        }

        .form-control::placeholder {
            color: #8195a8;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 3px rgba(7,136,255,0.12);
        }
    </style>
</head>

<body>

    <div class="login-container">
                <div class="login-header">

            <div class="login-logo">
                <img src="LOGO_FLOWS-PRO-removebg-preview.png"
                     alt="Logo FLOWS-PRO">
            </div>

            <h1>Selamat Datang Kembali</h1>

            <p>
                Masuk untuk memantau kondisi air secara real-time
                melalui FLOWS-PRO.
            </p>

            <div class="security-badge">
                <i class="fas fa-shield-alt"></i>
                Sistem Monitoring Banjir
            </div>

        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Masukkan email Anda"
                        autocomplete="email"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required>

                    <i class="fas fa-eye password-toggle"
                       id="togglePassword"></i>
                </div>
            </div>

            <div class="form-options">

                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    Ingat saya
                </label>

                <a href="reset-password.html" class="forgot-link">
                    Lupa password?
                </a>

            </div>

            <button type="submit" class="btn-login" id="loginButton">
                <i class="fas fa-sign-in-alt"></i>
                Masuk ke Dashboard
            </button>

        </form>

        <div class="divider">atau masuk dengan</div>

        <button type="button" class="btn-google" id="googleLogin">
            <i class="fab fa-google"></i>
            Lanjutkan dengan Google
        </button>

        <div class="login-footer">
            Belum punya akun?
            <a href="register.html">Daftar sekarang</a>
        </div>

        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i>
            Kembali ke Beranda
        </a>
            <style>
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8ba3b8;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 5px 0 22px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
        }

        .remember-me input {
            accent-color: var(--primary);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            color: var(--secondary);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 8px 22px rgba(0,136,255,0.25);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0,136,255,0.38);
        }

        .btn-login:disabled,
        .btn-google:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 25px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .btn-google {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            transition: 0.25s ease;
        }

        .btn-google:hover {
            background: rgba(255,255,255,0.12);
            border-color: var(--primary);
        }

        .message {
            display: none;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
        }

        .message.success {
            display: block;
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.35);
            color: #86efac;
        }

        .message.error {
            display: block;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.35);
            color: #fca5a5;
        }

        .login-footer {
            margin-top: 25px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .login-footer a:hover {
            color: var(--secondary);
        }

        .back-home {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .back-home:hover {
            color: white;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 18px;
            }

            .login-container {
                padding: 28px 22px;
                border-radius: 18px;
            }

            .login-header h1 {
                font-size: 25px;
            }

            .form-options {
                font-size: 12px;
            }
        }
    </style>

    </div>

</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://nydapuhnswrbgbjkaxqa.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_dypnRnjABFIf6GcshfrTIA_Q0zhuR0L";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const googleLogin = document.getElementById("googleLogin");
    const messageBox = document.getElementById("message");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    function showMessage(message, type) {
        messageBox.textContent = message;
        messageBox.className = "message " + type;
    }

    function setLoading(isLoading) {
        loginButton.disabled = isLoading;

        loginButton.innerHTML = isLoading
            ? '<i class="fas fa-spinner fa-spin"></i> Memproses...'
            : '<i class="fas fa-sign-in-alt"></i> Masuk ke Dashboard';
    }

    // Tampilkan atau sembunyikan password
    togglePassword.addEventListener("click", function () {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";

        togglePassword.classList.toggle("fa-eye", !isPassword);
        togglePassword.classList.toggle("fa-eye-slash", isPassword);
    });

    // Login email dan password
    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = passwordInput.value;

        setLoading(true);
        showMessage("Sedang memverifikasi akun...", "success");

        try {
            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) throw error;

            showMessage("Login berhasil! Mengalihkan...", "success");

            window.location.href = "dashboard.html";

        } catch (error) {
            showMessage(
                error.message || "Login gagal. Periksa email dan password.",
                "error"
            );

            setLoading(false);
        }
    });

    // Login Google
    googleLogin.addEventListener("click", async function () {
        googleLogin.disabled = true;

        try {
            const { error } =
                await supabaseClient.auth.signInWithOAuth({
                    provider: "google",
                    options: {
                        redirectTo:
                            window.location.origin + "/auth-callback.html"
                    }
                });

            if (error) throw error;

        } catch (error) {
            showMessage(
                error.message || "Login Google gagal.",
                "error"
            );

            googleLogin.disabled = false;
        }
    });

    // Periksa sesi login
    async function checkExistingSession() {
        const { data, error } =
            await supabaseClient.auth.getSession();

        if (!error && data.session) {
            window.location.replace("dashboard.html");
        }
    }

    checkExistingSession();
</script>
   </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FLOWS-PRO | Memproses Akun</title>

    <!-- =====================================================
         FAVICON
         ===================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="LOGO removebg-preview.png"
    >

    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- =====================================================
         SUPABASE JS
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>

    <!-- =====================================================
         STYLE
         ===================================================== -->

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #ffffff;

            background:
                linear-gradient(
                    rgba(3, 10, 20, 0.82),
                    rgba(3, 10, 20, 0.92)
                ),
                url("Desain tanpa judul (1).png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            overflow: hidden;
        }

        /* =================================================
           BACKGROUND EFFECT
           ================================================= */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 183, 255, 0.14),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 255, 200, 0.10),
                    transparent 35%
                );

            pointer-events: none;
        }

        /* =================================================
           CARD
           ================================================= */

        .callback-card {

            position: relative;

            width: min(92%, 480px);

            padding: 45px 35px;

            text-align: center;

            background:
                rgba(10, 20, 35, 0.78);

            border:
                1px solid rgba(255, 255, 255, 0.12);

            border-radius: 24px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            z-index: 2;

            animation:
                cardAppear 0.6s ease;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        /* =================================================
           LOGO
           ================================================= */

        .logo {

            width: 100px;
            height: 100px;

            object-fit: contain;

            margin-bottom: 22px;

            filter:
                drop-shadow(
                    0 8px 20px rgba(0, 0, 0, 0.35)
                );
        }

        /* =================================================
           ICON
           ================================================= */

        .status-icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(0, 190, 255, 0.12);

            border:
                1px solid rgba(0, 190, 255, 0.25);

            color: #42cfff;

            font-size: 28px;

            box-shadow:
                0 0 30px rgba(0, 190, 255, 0.12);
        }

        .status-icon.success {

            background:
                rgba(40, 220, 140, 0.12);

            border-color:
                rgba(40, 220, 140, 0.28);

            color:
                #35df91;

        }

        .status-icon.error {

            background:
                rgba(255, 80, 90, 0.12);

            border-color:
                rgba(255, 80, 90, 0.28);

            color:
                #ff6670;

        }

        /* =================================================
           TITLE
           ================================================= */

        h1 {

            font-size: 25px;

            font-weight: 700;

            letter-spacing: -0.3px;

            margin-bottom: 10px;
        }

        /* =================================================
           MESSAGE
           ================================================= */

        #statusMessage {

            color:
                rgba(255, 255, 255, 0.68);

            font-size: 14px;

            line-height: 1.7;

            min-height: 48px;

        }

        /* =================================================
           LOADING
           ================================================= */

        .loader {

            width: 42px;
            height: 42px;

            margin: 25px auto 0;

            border-radius: 50%;

            border:
                3px solid
                rgba(255, 255, 255, 0.10);

            border-top-color:
                #42cfff;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        /* =================================================
           BUTTON
           ================================================= */

        .action-button {

            display: none;

            width: 100%;

            margin-top: 25px;

            padding: 13px 20px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #08aeea,
                    #2af598
                );

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }

        .action-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(0, 200, 220, 0.20);

        }

        /* =================================================
           SMALL SCREEN
           ================================================= */

        @media (max-width: 500px) {

            .callback-card {

                padding:
                    35px 24px;

                border-radius:
                    20px;

            }

            .logo {

                width: 85px;
                height: 85px;

            }

            h1 {

                font-size: 22px;

            }

        }

    </style>
</head>

<body>

    <!-- =====================================================
         CALLBACK CARD
         ===================================================== -->

    <main class="callback-card">

        <img
            class="logo"
            src="FLOWS-PRO-preview 1.png"
            alt="FLOWS-PRO"
        >

        <div
            class="status-icon"
            id="statusIcon"
        >
            <i
                class="fa-solid fa-spinner fa-spin"
                id="statusIconSymbol"
            ></i>
        </div>

        <h1 id="statusTitle">
            Memproses akun...
        </h1>

        <p id="statusMessage">
            Mohon tunggu. Kami sedang memverifikasi akun Google Anda.
        </p>

        <div
            class="loader"
            id="loader"
        ></div>

        <button
            class="action-button"
            id="actionButton"
            type="button"
        >
            Kembali ke Login
        </button>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>

        // ====================================================
        // PART 5 — GOOGLE OAUTH CALLBACK
        // ====================================================

        document.addEventListener(
            'DOMContentLoaded',
            async function () {

                // ------------------------------------------------
                // 1. Konfigurasi Supabase
                // ------------------------------------------------

                const SUPABASE_URL =
                    'https://nydapuhnswrbgbjkaxqa.supabase.co';

                const SUPABASE_ANON_KEY =
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55ZGFwdWhuc3dyYmdiamtheHFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MzI2NTEsImV4cCI6MjEwNjAwODY1MX0.hJG7hUTuRic3sJmCWDONNyL5Qay-vfdu2vLAMG6FzfI';


                // ------------------------------------------------
                // 2. Elemen UI
                // ------------------------------------------------

                const statusIcon =
                    document.getElementById('statusIcon');

                const statusIconSymbol =
                    document.getElementById('statusIconSymbol');

                const statusTitle =
                    document.getElementById('statusTitle');

                const statusMessage =
                    document.getElementById('statusMessage');

                const loader =
                    document.getElementById('loader');

                const actionButton =
                    document.getElementById('actionButton');


                // ------------------------------------------------
                // 3. Fungsi tampilan sukses
                // ------------------------------------------------

                function showSuccess(message) {

                    statusIcon.classList.remove('error');
                    statusIcon.classList.add('success');

                    statusIconSymbol.className =
                        'fa-solid fa-check';

                    statusTitle.textContent =
                        'Berhasil!';

                    statusMessage.textContent =
                        message;

                    loader.style.display =
                        'none';

                }


                // ------------------------------------------------
                // 4. Fungsi tampilan error
                // ------------------------------------------------

                function showError(message) {

                    statusIcon.classList.remove('success');
                    statusIcon.classList.add('error');

                    statusIconSymbol.className =
                        'fa-solid fa-xmark';

                    statusTitle.textContent =
                        'Terjadi Kesalahan';

                    statusMessage.textContent =
                        message;

                    loader.style.display =
                        'none';

                    actionButton.style.display =
                        'block';

                }


                // ------------------------------------------------
                // 5. Tombol kembali login
                // ------------------------------------------------

                actionButton.addEventListener(
                    'click',
                    function () {

                        window.location.href =
                            'login.html';

                    }
                );


                // ------------------------------------------------
                // 6. Pastikan Supabase JS tersedia
                // ------------------------------------------------

                if (
                    !window.supabase ||
                    typeof window.supabase.createClient !==
                    'function'
                ) {

                    showError(
                        'Library Supabase belum berhasil dimuat. Silakan periksa koneksi internet.'
                    );

                    return;
                }


                // ------------------------------------------------
                // 7. Pastikan Anon/Publishable Key sudah diisi
                // ------------------------------------------------

                if (
                    !SUPABASE_ANON_KEY ||
                    SUPABASE_ANON_KEY ===
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjZWJsbm1uZ25uZXh4dGtlaWV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5OTc5MDQsImV4cCI6MjA5MTU3MzkwNH0.jRFevO_3qqjUpL3nNtYKqH-vExMabcnNzDYbThpJdjs'
                ) {

                    showError(
                        'Supabase Anon/Publishable Key belum dikonfigurasi.'
                    );

                    return;
                }


                // ------------------------------------------------
                // 8. Buat client Supabase
                // ------------------------------------------------

                const supabaseClient =
                    window.supabase.createClient(
                        SUPABASE_URL,
                        SUPABASE_ANON_KEY
                    );


                try {

                    // --------------------------------------------
                    // 9. Ambil session dari OAuth
                    // --------------------------------------------

                    const {
                        data: sessionData,
                        error: sessionError
                    } =
                        await supabaseClient.auth.getSession();


                    // --------------------------------------------
                    // 10. Cek error session
                    // --------------------------------------------

                    if (sessionError) {

                        console.error(
                            'Session error:',
                            sessionError
                        );

                        showError(
                            'Sesi Google tidak dapat diverifikasi.'
                        );

                        return;
                    }


                    // --------------------------------------------
                    // 11. Pastikan session tersedia
                    // --------------------------------------------

                    const session =
                        sessionData?.session;


                    if (!session) {

                        showError(
                            'Sesi login Google tidak ditemukan. Silakan ulangi proses login.'
                        );

                        return;
                    }


                    // --------------------------------------------
                    // 12. Ambil user
                    // --------------------------------------------

                    const user =
                        session.user;


                    if (!user) {

                        showError(
                            'Data akun Google tidak ditemukan.'
                        );

                        return;
                    }


                    console.log(
                        'Google user:',
                        user
                    );


                    // --------------------------------------------
                    // 13. Ambil metadata Google
                    // --------------------------------------------

                    const metadata =
                        user.user_metadata || {};


                    const googleName =
                        metadata.full_name ||
                        metadata.name ||
                        metadata.user_name ||
                        user.email?.split('@')[0] ||
                        'Operator';


                    const googleAvatar =
                        metadata.avatar_url ||
                        metadata.picture ||
                        null;


                    const googleEmail =
                        user.email || '';


                    // --------------------------------------------
                    // 14. Siapkan data profile
                    // --------------------------------------------

                    const profileData = {

                        id: user.id,

                        nama: googleName,

                        email: googleEmail,

                        role: 'Operator',

                        tanggal_lahir: null,

                        lokasi: null,

                        avatar_url: googleAvatar

                    };


                    console.log(
                        'Profile data:',
                        profileData
                    );


                    // --------------------------------------------
                    // 15. Simpan / update profile
                    // --------------------------------------------

                    const {
                        error: profileError
                    } =
                        await supabaseClient
                            .from('profiles')
                            .upsert(
                                profileData,
                                {
                                    onConflict: 'id'
                                }
                            );


                    // --------------------------------------------
                    // 16. Jika profile gagal
                    // --------------------------------------------

                    if (profileError) {

                        console.error(
                            'Profile error:',
                            profileError
                        );

                        /*
                         * Authentication Google sudah berhasil.
                         *
                         * Error di sini biasanya berhubungan
                         * dengan tabel profiles atau RLS.
                         */

                        showError(
                            'Akun Google berhasil terhubung, tetapi profil FLOWS-PRO belum dapat disimpan. Periksa tabel profiles dan Row Level Security (RLS).'
                        );

                        return;
                    }


                    // --------------------------------------------
                    // 17. Berhasil
                    // --------------------------------------------

                    showSuccess(
                        'Akun Google berhasil terhubung. Anda akan diarahkan ke dashboard.'
                    );


                    // --------------------------------------------
                    // 18. Redirect dashboard
                    // --------------------------------------------

                    setTimeout(
                        function () {

                            window.location.href =
                                'dashboard.html';

                        },
                        1500
                    );


                } catch (error) {

                    // --------------------------------------------
                    // 19. Error tak terduga
                    // --------------------------------------------

                    console.error(
                        'OAuth callback error:',
                        error
                    );

                    showError(
                        'Terjadi kesalahan saat memproses akun Google. Silakan coba lagi.'
                    );

                }

            }
        );

    </script>

</body>
</html>

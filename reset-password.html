<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | FLOWS-PRO</title>

    <meta name="description" content="Pulihkan akses akun FLOWS-PRO dengan mengatur ulang kata sandi.">

    <link rel="icon" href="LOGO_FLOWS-PRO-removebg-preview.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #0ea5e9;
            --dark: #0f172a;
            --text: #334155;
            --muted: #64748b;
            --border: #e2e8f0;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--dark);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(56, 189, 248, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f8fafc 55%,
                    #e0f2fe
                );

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .background-circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        .circle-one {
            width: 300px;
            height: 300px;
            background: rgba(59, 130, 246, 0.07);
            top: -100px;
            right: -80px;
        }

        .circle-two {
            width: 220px;
            height: 220px;
            background: rgba(14, 165, 233, 0.08);
            bottom: -80px;
            left: -60px;
        }

        .reset-card {
            width: 100%;
            max-width: 460px;
            background: var(--white);
            border: 1px solid #dbeafe;
            border-radius: 24px;
            padding: 40px 38px;

            box-shadow:
                0 20px 60px rgba(30, 64, 175, 0.09),
                0 4px 15px rgba(15, 23, 42, 0.03);

            animation: fadeUp 0.6s ease both;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .brand img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-name span {
            color: var(--primary);
        }

        .brand-tagline {
            display: block;
            font-size: 9px;
            color: var(--muted);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .icon-wrapper {
            width: 65px;
            height: 65px;
            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;
            background: #eff6ff;
            color: var(--primary);
            font-size: 25px;
        }

        .reset-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .reset-heading h1 {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.6px;
            margin-bottom: 12px;
        }

        .reset-heading p {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.8;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 14px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 43px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: #f8fafc;
            font-family: inherit;
            font-size: 13px;
            transition: 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.09);
        }

        .reset-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #0ea5e9
            );

            color: white;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .reset-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.20);
        }

        .reset-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 23px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .status-message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.7;
        }

        .status-message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        .status-message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .reset-card {
                padding: 32px 23px;
                border-radius: 18px;
            }

            .reset-heading h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>

    <main class="reset-card">

        <div class="brand">

            <img
                src="LOGO_FLOWS-PRO-removebg-preview.png"
                alt="Logo FLOWS-PRO"
            >

            <div>
                <div class="brand-name">
                    FLOWS<span>-PRO</span>
                </div>

                <span class="brand-tagline">
                    FLOOD LEVEL OBSERVATION SYSTEM
                </span>
            </div>

        </div>
                <!-- ICON -->

        <div class="icon-wrapper" id="resetIcon">
            <i class="fa-solid fa-lock"></i>
        </div>


        <!-- HEADING -->

        <div class="reset-heading">

            <h1 id="resetTitle">
                Lupa Kata Sandi?
            </h1>

            <p id="resetDescription">
                Jangan khawatir. Masukkan email akun FLOWS-PRO
                Anda untuk menerima tautan pemulihan kata sandi.
            </p>

        </div>


        <!-- FORM KIRIM EMAIL RESET -->

        <form id="requestResetForm">

            <div class="form-group">

                <label for="email">
                    Alamat Email
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>

            <button
                type="submit"
                class="reset-button"
                id="requestResetButton"
            >
                <i class="fa-solid fa-paper-plane"></i>
                Kirim Tautan Pemulihan
            </button>

        </form>


        <!-- FORM PASSWORD BARU -->

        <form id="updatePasswordForm" style="display:none;">

            <div class="form-group">

                <label for="newPassword">
                    Kata Sandi Baru
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Minimal 8 karakter"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="confirmNewPassword">
                    Konfirmasi Kata Sandi Baru
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-shield-halved"></i>

                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Ulangi kata sandi baru"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="reset-button"
                id="updatePasswordButton"
            >
                <i class="fa-solid fa-check"></i>
                Simpan Kata Sandi Baru
            </button>

        </form>


        <!-- STATUS -->

        <div
            class="status-message"
            id="statusMessage"
            role="status"
            aria-live="polite"
        ></div>


        <!-- BACK TO LOGIN -->

        <a href="login.html" class="back-link" id="backLink">
            <i class="fa-solid fa-arrow-left"></i>
            Kembali ke halaman login
        </a>
            <!-- SUPABASE LIBRARY -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ==========================================
        // KONFIGURASI SUPABASE
        // ==========================================

        const SUPABASE_URL =
            "https://nydapuhnswrbgbjkaxqa.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_dypnRnjABFIf6GcshfrTIA_Q0zhuR0L";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        // ==========================================
        // ELEMEN HALAMAN
        // ==========================================

        const requestResetForm =
            document.getElementById("requestResetForm");

        const updatePasswordForm =
            document.getElementById("updatePasswordForm");

        const emailInput =
            document.getElementById("email");

        const newPasswordInput =
            document.getElementById("newPassword");

        const confirmNewPasswordInput =
            document.getElementById("confirmNewPassword");

        const requestResetButton =
            document.getElementById("requestResetButton");

        const updatePasswordButton =
            document.getElementById("updatePasswordButton");

        const resetTitle =
            document.getElementById("resetTitle");

        const resetDescription =
            document.getElementById("resetDescription");

        const resetIcon =
            document.getElementById("resetIcon");

        const statusMessage =
            document.getElementById("statusMessage");

        const backLink =
            document.getElementById("backLink");


        // ==========================================
        // PESAN STATUS
        // ==========================================

        function showMessage(message, type = "error") {

            statusMessage.textContent = message;

            statusMessage.className =
                "status-message " + type;

            statusMessage.style.display = "block";
        }


        // ==========================================
        // KIRIM EMAIL PEMULIHAN
        // ==========================================

        requestResetForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email = emailInput.value.trim();

            requestResetButton.disabled = true;

            requestResetButton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...';

            try {

                const redirectUrl =
                    `${window.location.origin}/reset-password.html`;

                const { error } =
                    await supabaseClient.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo: redirectUrl
                        }
                    );

                if (error) {
                    throw error;
                }

                showMessage(
                    "Jika email terdaftar, tautan pemulihan akan dikirim. Silakan periksa kotak masuk atau folder spam.",
                    "success"
                );

                requestResetForm.reset();

            } catch (error) {

                console.error("Reset Email Error:", error);

                showMessage(
                    error.message ||
                    "Gagal mengirim tautan pemulihan."
                );

            } finally {

                requestResetButton.disabled = false;

                requestResetButton.innerHTML =
                    '<i class="fa-solid fa-paper-plane"></i> Kirim Tautan Pemulihan';

            }

        });


        // ==========================================
        // TAMPILKAN FORM PASSWORD BARU
        // ==========================================

        function showUpdatePasswordForm() {

            requestResetForm.style.display = "none";

            updatePasswordForm.style.display = "block";

            resetTitle.textContent =
                "Buat Kata Sandi Baru";

            resetDescription.textContent =
                "Silakan masukkan kata sandi baru untuk akun FLOWS-PRO Anda.";

            resetIcon.innerHTML =
                '<i class="fa-solid fa-shield-halved"></i>';

            showMessage(
                "Tautan pemulihan berhasil diverifikasi. Anda dapat membuat kata sandi baru.",
                "success"
            );

        }


        // ==========================================
        // PERIKSA SESI PEMULIHAN
        // ==========================================

        let recoverySessionReady = false;

        supabaseClient.auth.onAuthStateChange(
            (event, session) => {

                if (
                    event === "PASSWORD_RECOVERY" &&
                    session
                ) {

                    recoverySessionReady = true;

                    showUpdatePasswordForm();

                }

            }
        );


        // Periksa sesi yang mungkin sudah tersedia

        async function checkRecoverySession() {

            const { data, error } =
                await supabaseClient.auth.getSession();

            if (error) {
                console.error(error);
                return;
            }

            if (
                data.session &&
                !recoverySessionReady
            ) {

                const urlParams =
                    new URLSearchParams(window.location.search);

                const isRecovery =
                    urlParams.get("type") === "recovery" ||
                    window.location.hash.includes("type=recovery");

                if (isRecovery) {
                    showUpdatePasswordForm();
                }

            }

        }

        checkRecoverySession();


        // ==========================================
        // SIMPAN PASSWORD BARU
        // ==========================================

        updatePasswordForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const newPassword =
                newPasswordInput.value;

            const confirmPassword =
                confirmNewPasswordInput.value;

            if (newPassword.length < 8) {

                showMessage(
                    "Kata sandi minimal 8 karakter."
                );

                return;
            }

            if (newPassword !== confirmPassword) {

                showMessage(
                    "Konfirmasi kata sandi tidak cocok."
                );

                confirmNewPasswordInput.focus();

                return;
            }

            updatePasswordButton.disabled = true;

            updatePasswordButton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

            try {

                const { data: sessionData, error: sessionError } =
                    await supabaseClient.auth.getSession();

                if (sessionError) {
                    throw sessionError;
                }

                if (!sessionData.session) {
                    throw new Error(
                        "Sesi pemulihan tidak ditemukan. Silakan minta tautan reset baru."
                    );
                }

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: newPassword
                    });

                if (error) {
                    throw error;
                }

                showMessage(
                    "Kata sandi berhasil diperbarui! Silakan login menggunakan kata sandi baru.",
                    "success"
                );

                updatePasswordForm.reset();

                updatePasswordForm.style.display = "none";

                resetTitle.textContent =
                    "Password Berhasil Diubah";

                resetDescription.textContent =
                    "Akun FLOWS-PRO Anda sudah menggunakan kata sandi baru.";

                resetIcon.innerHTML =
                    '<i class="fa-solid fa-circle-check"></i>';

                // Keluar dari sesi pemulihan
                await supabaseClient.auth.signOut();

                backLink.innerHTML =
                    '<i class="fa-solid fa-arrow-right"></i> Login Sekarang';

                setTimeout(() => {
                    window.location.replace("login.html");
                }, 2500);

            } catch (error) {

                console.error("Update Password Error:", error);

                showMessage(
                    error.message ||
                    "Gagal memperbarui kata sandi."
                );

            } finally {

                updatePasswordButton.disabled = false;

                updatePasswordButton.innerHTML =
                    '<i class="fa-solid fa-check"></i> Simpan Kata Sandi Baru';

            }

        });

    </script>
        </main>

    <footer style="
        text-align: center;
        padding: 20px;
        color: #64748b;
        font-size: 12px;
    ">
        © <span id="resetYear">2026</span> FLOWS-PRO.
        Flood Level Observation and Warning System.
    </footer>

    <script>
        document.getElementById("resetYear").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>

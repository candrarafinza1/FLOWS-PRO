<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar Akun | FLOWS-PRO</title>

    <link rel="icon" href="LOGO_FLOWS-PRO-removebg-preview.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --primary: #0788ff;
            --secondary: #00c6f7;
            --dark: #071b2d;
            --white: #ffffff;
            --muted: #a9bacb;
            --border: rgba(255,255,255,0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            color: var(--white);
            background:
                linear-gradient(rgba(3,18,33,0.82), rgba(3,18,33,0.94)),
                url("banjir.jpg") center/cover fixed;
        }

        .register-container {
            width: 100%;
            max-width: 520px;
            padding: 38px;
            background: rgba(12,34,53,0.93);
            border: 1px solid var(--border);
            border-radius: 22px;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
            animation: fadeUp 0.6s ease;
        }

        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .register-logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
        }

        .register-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .register-header h1 {
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 9px;
        }

        .register-header p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #dce8f4;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8ba3b8;
        }

        .form-control {
            width: 100%;
            padding: 14px 44px;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            color: white;
            font-family: inherit;
            font-size: 13px;
            transition: 0.25s ease;
        }

        .form-control::placeholder {
            color: #8195a8;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 3px rgba(7,136,255,0.12);
        }

        .form-control[type="date"] {
            color-scheme: dark;
        }

    </style>
</head>

<body>

    <div class="register-container">
                <div class="register-header">

            <div class="register-logo">
                <img src="LOGO_FLOWS-PRO-removebg-preview.png"
                     alt="Logo FLOWS-PRO">
            </div>

            <h1>Buat Akun Baru</h1>

            <p>
                Bergabung dengan FLOWS-PRO untuk memantau
                kondisi air dan informasi banjir.
            </p>

        </div>

        <div id="message" class="message"></div>

        <form id="registerForm">

            <div class="form-group">
                <label for="nama">Nama Lengkap</label>

                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>

                    <input
                        type="text"
                        id="nama"
                        class="form-control"
                        placeholder="Masukkan nama lengkap"
                        autocomplete="name"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="tanggalLahir">Tanggal Lahir</label>

                <div class="input-wrapper">
                    <i class="fas fa-calendar input-icon"></i>

                    <input
                        type="date"
                        id="tanggalLahir"
                        class="form-control"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="lokasi">Lokasi / Domisili</label>

                <div class="input-wrapper">
                    <i class="fas fa-map-marker-alt input-icon"></i>

                    <input
                        type="text"
                        id="lokasi"
                        class="form-control"
                        placeholder="Contoh: Dumai, Riau"
                        autocomplete="address-level2"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Minimal 8 karakter"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                    <i class="fas fa-eye password-toggle"
                       id="togglePassword"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password</label>

                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Ulangi password"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                    <i class="fas fa-eye password-toggle"
                       id="toggleConfirmPassword"></i>
                </div>
            </div>

            <label class="terms">
                <input type="checkbox" id="agreeTerms" required>
                <span>
                    Saya menyetujui penggunaan akun FLOWS-PRO
                    sesuai ketentuan yang berlaku.
                </span>
            </label>

            <button type="submit" class="btn-register" id="registerButton">
                <i class="fas fa-user-plus"></i>
                Buat Akun
            </button>

        </form>

        <div class="divider">atau daftar dengan</div>

        <button type="button" class="btn-google" id="googleRegister">
            <i class="fab fa-google"></i>
            Daftar dengan Google
        </button>

        <div class="register-footer">
            Sudah punya akun?
            <a href="login.html">Masuk sekarang</a>
        </div>

        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i>
            Kembali ke Beranda
        </a>
            <style>
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8ba3b8;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 8px 0 22px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
            cursor: pointer;
        }

        .terms input {
            margin-top: 3px;
            accent-color: var(--primary);
            flex-shrink: 0;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 8px 22px rgba(0,136,255,0.25);
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0,136,255,0.38);
        }

        .btn-register:disabled,
        .btn-google:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 24px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .btn-google {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            transition: 0.25s ease;
        }

        .btn-google:hover {
            background: rgba(255,255,255,0.12);
            border-color: var(--primary);
        }

        .message {
            display: none;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
        }

        .message.success {
            display: block;
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.35);
            color: #86efac;
        }

        .message.error {
            display: block;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.35);
            color: #fca5a5;
        }

        .register-footer {
            margin-top: 25px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .register-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .register-footer a:hover {
            color: var(--secondary);
        }

        .back-home {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .back-home:hover {
            color: white;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 18px;
            }

            .register-container {
                padding: 27px 21px;
                border-radius: 18px;
            }

            .register-header h1 {
                font-size: 24px;
            }
        }
    </style>

    </div>

</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://nydapuhnswrbgbjkaxqa.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_dypnRnjABFIf6GcshfrTIA_Q0zhuR0L";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    const registerForm = document.getElementById("registerForm");
    const registerButton = document.getElementById("registerButton");
    const googleRegister = document.getElementById("googleRegister");
    const messageBox = document.getElementById("message");

    function showMessage(message, type) {
        messageBox.textContent = message;
        messageBox.className = "message " + type;
    }

    function togglePasswordVisibility(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);

        const isPassword = input.type === "password";

        input.type = isPassword ? "text" : "password";

        icon.classList.toggle("fa-eye", !isPassword);
        icon.classList.toggle("fa-eye-slash", isPassword);
    }

    document.getElementById("togglePassword").addEventListener("click", function () {
        togglePasswordVisibility("password", "togglePassword");
    });

    document.getElementById("toggleConfirmPassword").addEventListener("click", function () {
        togglePasswordVisibility("confirmPassword", "toggleConfirmPassword");
    });

    registerForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const nama = document.getElementById("nama").value.trim();
        const email = document.getElementById("email").value.trim();
        const tanggalLahir = document.getElementById("tanggalLahir").value;
        const lokasi = document.getElementById("lokasi").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password.length < 8) {
            showMessage("Password minimal 8 karakter.", "error");
            return;
        }

        if (password !== confirmPassword) {
            showMessage("Konfirmasi password tidak sama.", "error");
            return;
        }

        registerButton.disabled = true;
        registerButton.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Membuat akun...';

        try {
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    emailRedirectTo: window.location.origin + "/login.html",
                    data: {
                        nama: nama,
                        tanggal_lahir: tanggalLahir,
                        lokasi: lokasi
                    }
                }
            });

            if (error) throw error;

            showMessage(
                "Pendaftaran berhasil. Silakan periksa email untuk verifikasi akun sebelum login.",
                "success"
            );

            registerForm.reset();

        } catch (error) {
            showMessage(
                error.message || "Pendaftaran gagal. Silakan coba lagi.",
                "error"
            );
        } finally {
            registerButton.disabled = false;
            registerButton.innerHTML =
                '<i class="fas fa-user-plus"></i> Buat Akun';
        }
    });

    googleRegister.addEventListener("click", async function () {
        googleRegister.disabled = true;

        try {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: "google",
                options: {
                    redirectTo: window.location.origin + "/auth-callback.html"
                }
            });

            if (error) throw error;

        } catch (error) {
            showMessage(
                error.message || "Registrasi Google gagal.",
                "error"
            );

            googleRegister.disabled = false;
        }
    });
</script>
</div>
